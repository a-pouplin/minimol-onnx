name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Installed, not editable: the suite asserts it did not import from src/.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      # Safe to run from the repo root: with a src/ layout, `src` is never on
      # sys.path, so `import minimol_onnx` resolves to the installed package.
      # tests/test_packaging.py asserts exactly that.
      - name: Test
        run: pytest -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install build twine
      - run: python -m build

      # The 32 MB graph must be in the wheel. A git-lfs checkout without
      # `lfs: true` would put a ~133-byte pointer here instead and everything
      # downstream would still "succeed".
      - name: Check wheel contents
        run: |
          python -m zipfile -l dist/*.whl
          python - <<'EOF'
          import glob, zipfile, sys
          whl = glob.glob("dist/*.whl")[0]
          assert whl.endswith("-py3-none-any.whl"), f"not a pure-python wheel: {whl}"
          names = {i.filename: i.file_size for i in zipfile.ZipFile(whl).infolist()}
          required = {
              "minimol_onnx/minimol_v1.onnx": 33_128_988,
              "minimol_onnx/featurization_kwargs.json": None,
              "minimol_onnx/minimol_feat/periodic_table.csv": None,
          }
          for name, size in required.items():
              assert name in names, f"missing from wheel: {name}"
              if size is not None:
                  assert names[name] == size, f"{name}: {names[name]} bytes, want {size}"
          print(f"OK: {whl}")
          EOF

      - run: twine check dist/*
