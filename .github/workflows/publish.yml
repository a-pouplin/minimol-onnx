name: publish

# Publishes to PyPI when a GitHub Release is published.
#
# Authentication is PyPI Trusted Publishing (OIDC) -- no API token is stored in
# this repository. Before the first run, add a pending publisher on PyPI:
#   PyPI -> Your projects -> Publishing -> Add a new pending publisher
#     PyPI project name : minimol-onnx
#     Owner             : a-pouplin
#     Repository        : minimol-onnx
#     Workflow name     : publish.yml
#     Environment name  : pypi

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install build
      - run: python -m build

      # Refuse to ship a wheel without the weights in it.
      - name: Verify wheel contents
        run: |
          python - <<'EOF'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          assert whl.endswith("-py3-none-any.whl"), f"not a pure-python wheel: {whl}"
          names = {i.filename: i.file_size for i in zipfile.ZipFile(whl).infolist()}
          assert names.get("minimol_onnx/minimol_v1.onnx") == 33_128_988, \
              f"bad or missing ONNX: {names.get('minimol_onnx/minimol_v1.onnx')} bytes"
          assert "minimol_onnx/featurization_kwargs.json" in names
          assert "minimol_onnx/minimol_feat/periodic_table.csv" in names
          print(f"OK: {whl}")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
